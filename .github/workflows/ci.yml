name: SpendWise CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  ci:
    name: Build, Test and Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: spendwise_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U testuser -d spendwise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # 4. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 5. Install mobile dependencies
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # 6. Build backend Docker image
      - name: Build backend Docker image
        run: docker build -t spendwise-backend:ci ./backend

      # 7. Build frontend Docker image
      - name: Build frontend Docker image
        run: docker build -t spendwise-frontend:ci ./frontend

      # 8. Initialize test database
      - name: Initialize test database
        env:
          PGPASSWORD: testpassword
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          psql -h localhost -U testuser -d spendwise_test -f database/schema.sql

          psql -h localhost -U testuser -d spendwise_test -c "
            INSERT INTO categories (name)
            VALUES
              ('Food'),
              ('Transport'),
              ('Shopping');
          "

      # 9. Run backend tests
      - name: Run backend tests
        working-directory: backend
        env:
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: spendwise_test
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: test-secret
        run: npm test -- --runInBand

      # 10. Run backend lint
      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      # 11. Run frontend tests
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      # 12. Run frontend lint
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      # 13. Run mobile tests
      - name: Run mobile tests
        working-directory: mobile
        run: npm test -- --runInBand

      # 14. Run mobile lint
      - name: Run mobile lint
        working-directory: mobile
        run: npm run lint

      # 15. Build backend TypeScript
      - name: Build backend
        working-directory: backend
        run: npm run build

      # 16. Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build