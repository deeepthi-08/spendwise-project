version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: spendwise-postgres
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spendwise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build: .
    container_name: spendwise-api
    ports:
      - "4000:4000"
    environment:
      DB_USER: spendwise
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: spendwise_db
    depends_on:
      - postgres


volumes:
  postgres_data: